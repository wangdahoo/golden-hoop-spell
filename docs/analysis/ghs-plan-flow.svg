<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C62828"/>
    </marker>
  </defs>

  <!-- legend -->
  <g font-size="11" fill="#1F2937">
    <rect x="628" y="14" width="13" height="13" rx="3" fill="#FFF4D6" stroke="#B8860B"/>
    <text x="646" y="25">用户动作</text>
    <rect x="628" y="34" width="13" height="13" rx="3" fill="#E8F0FE" stroke="#1A56A8"/>
    <text x="646" y="45">流程步骤</text>
    <rect x="628" y="54" width="13" height="13" rx="3" fill="#EDE7F6" stroke="#5E35B1"/>
    <text x="646" y="65">子代理</text>
    <rect x="740" y="14" width="13" height="13" rx="3" fill="#FFEBEE" stroke="#C62828"/>
    <text x="758" y="25">机械强制/守卫</text>
    <rect x="740" y="34" width="13" height="13" rx="3" fill="#E8F5E9" stroke="#2E7D32"/>
    <text x="758" y="45">产物/文档</text>
    <path d="M746,54 l7,7 l-7,7 l-7,-7 z" fill="#FFF3E0" stroke="#EF6C00"/>
    <text x="758" y="65">判断分支</text>
  </g>

  <!-- N1 user requirement -->
  <g>
    <rect x="290" y="20" width="320" height="36" rx="8" fill="#FFF4D6" stroke="#B8860B" stroke-width="1.5"/>
    <text x="450" y="43" text-anchor="middle" font-size="13" fill="#1F2937">用户需求（argument-hint）</text>
  </g>
  <path d="M450,56 L450,72" stroke="#6B7280" fill="none" marker-end="url(#arrow)"/>

  <!-- N2 Phase 0 -->
  <g>
    <rect x="290" y="76" width="320" height="64" rx="8" fill="#E8F0FE" stroke="#1A56A8" stroke-width="1.5"/>
    <text x="450" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Phase 0 初始化（dispatcher）</text>
    <text x="450" y="113" text-anchor="middle" font-size="11" fill="#475569">resolve_project_dir · 确认需求 · 建 .ghs/plans/.tmp</text>
    <text x="450" y="129" text-anchor="middle" font-size="11" fill="#475569">写 status.json（designing）· 生成 {date}-{slug}</text>
  </g>
  <path d="M450,140 L450,156" stroke="#6B7280" fill="none" marker-end="url(#arrow)"/>

  <!-- N3 Phase 0.5 -->
  <g>
    <rect x="290" y="160" width="320" height="64" rx="8" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
    <text x="450" y="179" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Phase 0.5 上下文快照</text>
    <text x="450" y="197" text-anchor="middle" font-size="11" fill="#475569">haiku 子代理提取（codegraph / grep 双模板）</text>
    <text x="450" y="213" text-anchor="middle" font-size="11" fill="#475569">分隔符解析 → context.md · 全轮次共享</text>
  </g>
  <path d="M450,224 L450,270" stroke="#6B7280" fill="none" marker-end="url(#arrow)"/>

  <!-- loop frame -->
  <rect x="250" y="272" width="400" height="266" rx="12" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="450" y="266" text-anchor="middle" font-size="11" fill="#64748B">评审-修订循环 · 硬上限 = max_rounds + MAX_BREACHES(2) 轮</text>

  <!-- N4 Phase 1 -->
  <g>
    <rect x="290" y="284" width="320" height="64" rx="8" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
    <text x="450" y="303" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Phase 1 方案设计（Round N）</text>
    <text x="450" y="321" text-anchor="middle" font-size="11" fill="#475569">Plan 子代理（无写权限）· 输出分隔符全文</text>
    <text x="450" y="337" text-anchor="middle" font-size="11" fill="#475569">解析器提取 → plan.md · status=reviewing</text>
  </g>
  <path d="M450,348 L450,364" stroke="#6B7280" fill="none" marker-end="url(#arrow)"/>

  <!-- N5 Phase 2 -->
  <g>
    <rect x="290" y="368" width="320" height="64" rx="8" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
    <text x="450" y="387" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Phase 2 方案评审（Round N）</text>
    <text x="450" y="405" text-anchor="middle" font-size="11" fill="#475569">general-purpose 子代理 · 分级 Severe/Medium/Opt</text>
    <text x="450" y="421" text-anchor="middle" font-size="11" fill="#475569">解析器提取 → review.md + verdict 字段</text>
  </g>
  <path d="M450,432 L450,452" stroke="#6B7280" fill="none" marker-end="url(#arrow)"/>

  <!-- D1 verdict -->
  <path d="M450,456 L540,486 L450,516 L360,486 Z" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5"/>
  <text x="450" y="491" text-anchor="middle" font-size="12" fill="#1F2937">Verdict?</text>

  <!-- FAIL round<max loop back -->
  <path d="M360,486 L180,486 L180,316 L286,316" stroke="#6B7280" fill="none" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="176" y="404" text-anchor="middle" font-size="11" fill="#64748B" transform="rotate(-90 176 404)">FAIL · round&lt;max · status=revising · 回设计（加法棘轮）</text>

  <!-- FAIL at max -->
  <g>
    <rect x="648" y="450" width="238" height="72" rx="8" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
    <text x="767" y="469" text-anchor="middle" font-size="12" font-weight="bold" fill="#7F1D1D">FAIL @ max_rounds</text>
    <text x="767" y="487" text-anchor="middle" font-size="11" fill="#7F1D1D">用户三选一：继续修订（breach+1，≤2）</text>
    <text x="767" y="503" text-anchor="middle" font-size="11" fill="#7F1D1D">· 接受（带病标记）· 中止</text>
  </g>
  <path d="M540,486 L644,486" stroke="#C62828" fill="none" marker-end="url(#arrowR)"/>
  <text x="592" y="478" text-anchor="middle" font-size="11" fill="#C62828">FAIL · round≥max</text>
  <!-- breach loop back -->
  <path d="M767,450 L767,316 L614,316" stroke="#C62828" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowR)"/>
  <text x="790" y="384" text-anchor="middle" font-size="11" fill="#C62828" transform="rotate(-90 790 384)">breach → 再一轮</text>
  <!-- accept path down -->
  <path d="M767,522 L767,640 L614,640" stroke="#C62828" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowR)"/>
  <text x="800" y="580" text-anchor="middle" font-size="11" fill="#C62828" transform="rotate(-90 800 580)">接受 → Phase 3/4</text>

  <!-- PASS down -->
  <path d="M450,516 L450,548" stroke="#6B7280" fill="none" marker-end="url(#arrow)"/>
  <text x="462" y="536" font-size="11" fill="#2E7D32">PASS（round==1 早停直通）</text>

  <!-- N6 Phase 2.5 -->
  <g>
    <rect x="290" y="552" width="320" height="40" rx="8" fill="#E8F0FE" stroke="#1A56A8" stroke-width="1.5"/>
    <text x="450" y="570" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2937">Phase 2.5 快照增补</text>
    <text x="450" y="586" text-anchor="middle" font-size="11" fill="#475569">ADDITIONAL FILES READ → Supplementary Context</text>
  </g>
  <path d="M450,592 L450,608" stroke="#6B7280" fill="none" marker-end="url(#arrow)"/>

  <!-- N7 Phase 3 -->
  <g>
    <rect x="290" y="612" width="320" height="64" rx="8" fill="#E8F0FE" stroke="#1A56A8" stroke-width="1.5"/>
    <text x="450" y="631" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Phase 3 用户审批（首次看到方案）</text>
    <text x="450" y="649" text-anchor="middle" font-size="11" fill="#475569">Approval Summary ≤34 行（读预算受限）</text>
    <text x="450" y="665" text-anchor="middle" font-size="11" fill="#475569">AskUserQuestion：批准 / 拒绝（拒绝回循环）</text>
  </g>
  <!-- reject loop -->
  <path d="M290,644 L140,644 L140,316 L286,316" stroke="#6B7280" fill="none" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="132" y="480" text-anchor="middle" font-size="11" fill="#64748B" transform="rotate(-90 132 480)">拒绝 · 带具体意见回 Phase 1（同样受上限约束）</text>
  <path d="M450,676 L450,700" stroke="#6B7280" fill="none" marker-end="url(#arrow)"/>
  <text x="462" y="692" font-size="11" fill="#2E7D32">批准</text>

  <!-- N8 Phase 4 -->
  <g>
    <rect x="290" y="704" width="320" height="64" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="450" y="723" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">Phase 4 定稿</text>
    <text x="450" y="741" text-anchor="middle" font-size="11" fill="#475569">cp plan → docs/ghs/plans/ · git commit</text>
    <text x="450" y="757" text-anchor="middle" font-size="11" fill="#475569">status=approved · 建议 /ghs:sprint 拆分</text>
  </g>

  <!-- bottom note -->
  <g>
    <rect x="250" y="800" width="400" height="76" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
    <text x="450" y="820" text-anchor="middle" font-size="11" fill="#475569">格式/终止约束强：解析器 4 层 fallback · MAX_RETRY=1 · happy path 零 .raw</text>
    <text x="450" y="838" text-anchor="middle" font-size="11" fill="#C62828">内容侧约束弱：6 章节模板默认全给 · 评审量表无范围/比例轴</text>
    <text x="450" y="856" text-anchor="middle" font-size="11" fill="#C62828">修订只做加法（每条 issue 必须显式解决）→ 方案单调变大</text>
  </g>
</svg>
