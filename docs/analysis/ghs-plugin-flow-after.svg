  <rect x="309" y="877" width="10" height="10" rx="2" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="323" y="886" font-size="10" fill="#64748b">编排/兼容层</text>
  <rect x="409" y="877" width="10" height="10" rx="2" fill="#fce7f3" stroke="#ec4899"/>
  <text x="423" y="886" font-size="10" fill="#64748b">交互原语</text>
  <rect x="487" y="877" width="10" height="10" rx="2" fill="#d1fae5" stroke="#22c55e"/>
  <text x="501" y="886" font-size="10" fill="#64748b">数据·脚本·状态</text>
