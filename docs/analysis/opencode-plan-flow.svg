<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C62828"/>
    </marker>
  </defs>

  <!-- legend -->
  <g font-size="11" fill="#1F2937">
    <rect x="628" y="14" width="13" height="13" rx="3" fill="#FFF4D6" stroke="#B8860B"/>
    <text x="646" y="25">用户动作</text>
    <rect x="628" y="34" width="13" height="13" rx="3" fill="#E8F0FE" stroke="#1A56A8"/>
    <text x="646" y="45">流程步骤</text>
    <rect x="628" y="54" width="13" height="13" rx="3" fill="#EDE7F6" stroke="#5E35B1"/>
    <text x="646" y="65">子代理</text>
    <rect x="740" y="14" width="13" height="13" rx="3" fill="#FFEBEE" stroke="#C62828"/>
    <text x="758" y="25">机械强制/守卫</text>
    <rect x="740" y="34" width="13" height="13" rx="3" fill="#E8F5E9" stroke="#2E7D32"/>
    <text x="758" y="45">产物/文档</text>
    <path d="M746,54 l7,7 l-7,7 l-7,-7 z" fill="#FFF3E0" stroke="#EF6C00"/>
    <text x="758" y="65">判断分支</text>
  </g>

  <!-- N0 switch to plan agent -->
  <g>
    <rect x="290" y="20" width="320" height="36" rx="8" fill="#FFF4D6" stroke="#B8860B" stroke-width="1.5"/>
    <text x="450" y="43" text-anchor="middle" font-size="13" fill="#1F2937">用户切换到 plan agent（Tab / 选择器）</text>
  </g>
  <path d="M450,56 L450,72" stroke="#6B7280" fill="none" marker-end="url(#arrow)"/>

  <!-- N1 permissions -->
  <g>
    <rect x="250" y="76" width="400" height="64" rx="8" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
    <text x="450" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#7F1D1D">权限规则挂载（L1 物理强制）</text>
    <text x="450" y="115" text-anchor="middle" font-size="11" fill="#7F1D1D">edit deny * · allow ~/.opencode/plan/* · question allow</text>
    <text x="450" y="131" text-anchor="middle" font-size="11" fill="#7F1D1D">计划文件白名单 = 唯一可写例外（需用户明确要求）</text>
  </g>
  <path d="M450,140 L450,156" stroke="#6B7280" fill="none" marker-end="url(#arrow)"/>

  <!-- N2 enter reminder -->
  <g>
    <rect x="290" y="160" width="320" height="44" rx="8" fill="#E8F0FE" stroke="#1A56A8" stroke-width="1.5"/>
    <text x="450" y="179" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2937">注入 enter system-reminder</text>
    <text x="450" y="196" text-anchor="middle" font-size="11" fill="#475569">在对话中直接讨论计划 · 不写计划文件 · 不实现</text>
  </g>
  <path d="M450,204 L450,224" stroke="#6B7280" fill="none" marker-end="url(#arrow)"/>

  <!-- N3 conversation loop -->
  <rect x="230" y="228" width="440" height="92" rx="12" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <g>
    <rect x="250" y="244" width="400" height="60" rx="8" fill="#E8F0FE" stroke="#1A56A8" stroke-width="1.5"/>
    <text x="450" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">对话循环（单代理 · 人在环）</text>
    <text x="450" y="283" text-anchor="middle" font-size="11" fill="#475569">探索代码库 · 与用户直接讨论 · 计划默认住对话</text>
    <text x="450" y="299" text-anchor="middle" font-size="11" fill="#475569">用户明确要求时 → 仅可写 ~/.opencode/plan/ 白名单目录</text>
  </g>

  <!-- N4 block branch (right) -->
  <g>
    <rect x="672" y="240" width="214" height="68" rx="8" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
    <text x="779" y="259" text-anchor="middle" font-size="11" font-weight="bold" fill="#7F1D1D">尝试 edit/write/patch</text>
    <text x="779" y="276" text-anchor="middle" font-size="11" fill="#7F1D1D">→ Permission.BlockedError 拦截</text>
    <text x="779" y="292" text-anchor="middle" font-size="11" fill="#7F1D1D">→ 错误改写为可读提示</text>
  </g>
  <path d="M650,274 L668,274" stroke="#C62828" fill="none" marker-end="url(#arrowR)"/>
  <path d="M779,308 L779,340 L674,340" stroke="#C62828" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowR)"/>
  <path d="M670,340 L470,340 L470,308" stroke="#C62828" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowR)"/>
  <text x="570" y="356" text-anchor="middle" font-size="11" fill="#C62828">回到对话循环（物理改不动）</text>

  <!-- N5 anti-drift reconcile -->
  <g>
    <rect x="250" y="336" width="400" height="64" rx="8" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
    <text x="450" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#7F1D1D">防漂移对账（框架级不变量）</text>
    <text x="450" y="372" text-anchor="middle" font-size="11" fill="#7F1D1D">每次 context 事件检查最后一条 reminder：</text>
    <text x="450" y="388" text-anchor="middle" font-size="11" fill="#7F1D1D">plan 中且缺失 → 重注入 enter · 非 plan 且残留 → 补 leave</text>
  </g>
  <path d="M450,320 L450,332" stroke="#6B7280" fill="none" marker-end="url(#arrow)"/>
  <path d="M450,400 L450,472" stroke="#6B7280" fill="none" marker-end="url(#arrow)"/>
  <text x="462" y="440" font-size="11" fill="#64748B">对抗 compaction 导致的约束衰减</text>

  <!-- D1 switch out? -->
  <path d="M450,476 L540,504 L450,532 L360,504 Z" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5"/>
  <text x="450" y="509" text-anchor="middle" font-size="12" fill="#1F2937">用户切出 plan agent?</text>
  <path d="M360,504 L120,504 L120,274 L246,274" stroke="#6B7280" fill="none" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="112" y="390" text-anchor="middle" font-size="11" fill="#64748B" transform="rotate(-90 112 390)">否 → 继续对话循环</text>
  <path d="M450,532 L450,556" stroke="#6B7280" fill="none" marker-end="url(#arrow)"/>
  <text x="462" y="548" font-size="11" fill="#2E7D32">是</text>

  <!-- N6 leave -->
  <g>
    <rect x="290" y="560" width="320" height="44" rx="8" fill="#E8F0FE" stroke="#1A56A8" stroke-width="1.5"/>
    <text x="450" y="579" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2937">注入 leave reminder · 权限恢复</text>
    <text x="450" y="596" text-anchor="middle" font-size="11" fill="#475569">"之前的 Plan 限制不再生效" · 回到默认 agent</text>
  </g>

  <!-- bottom note -->
  <g>
    <rect x="230" y="628" width="440" height="52" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
    <text x="450" y="648" text-anchor="middle" font-size="11" fill="#475569">无 plan 专用 system prompt（基础提示词仅 15 行）· 行为约束全在 reminder + 权限层</text>
    <text x="450" y="666" text-anchor="middle" font-size="11" fill="#C62828">无方案产出物、无评审环节 —— 赌注完全押在"人在对话里"</text>
  </g>
</svg>
