<svg viewBox="0 0 880 1045" width="880" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f6"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ef4444"/>
    </marker>
  </defs>

  <text x="440" y="34" font-size="16" fill="#1e293b" text-anchor="middle">ghs:plan 重构后完整流程（Phase 0-6）</text>
  <text x="440" y="52" font-size="10" fill="#64748b" text-anchor="middle">横切：Format Recovery（MAX_RETRY=1/kind · retry_counts 落盘）｜文件真相源（分支前读 status.json）｜模型调用硬封顶 ≤4 次</text>

  <!-- 泳道背景带: 用户 x=20-160, Dispatcher x=175-425, 子代理 x=440-620, 数据文件 x=635-860 -->
  <rect x="20" y="62" width="140" height="884" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="175" y="62" width="250" height="884" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="440" y="62" width="180" height="884" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="635" y="62" width="225" height="884" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="90" y="80" font-size="11" fill="#64748b" text-anchor="middle">用户</text>
  <text x="300" y="80" font-size="11" fill="#64748b" text-anchor="middle">Dispatcher（主对话）</text>
  <text x="530" y="80" font-size="11" fill="#64748b" text-anchor="middle">子代理</text>
  <text x="747" y="80" font-size="11" fill="#64748b" text-anchor="middle">数据文件</text>

  <!-- ===== 底层连接线 ===== -->
  <!-- 主干 -->
  <path d="M300,148 L300,159" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M300,223 L300,239" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M300,303 L300,319" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M300,401 L300,419" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M300,501 L300,511" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M300,575 L300,749" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M300,831 L300,845" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M300,927 L300,941" stroke="#64748b" marker-end="url(#arrow)"/>
  <!-- 用户双向 -->
  <path d="M155,270 L179,270" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <path d="M185,292 L161,292" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <path d="M155,780 L179,780" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <path d="M185,806 L161,806" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <!-- 分诊（二期，紫虚线） -->
  <path d="M150,119 L179,119" stroke="#a855f6" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <!-- dispatcher ↔ 子代理 -->
  <path d="M415,183 L429,183" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M435,205 L421,205" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M415,350 L429,350" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M435,374 L421,374" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M415,448 L429,448" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M435,478 L421,478" stroke="#64748b" marker-end="url(#arrow)"/>
  <!-- 写文件（绿） -->
  <path d="M610,194 L639,194" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <path d="M415,274 L639,274" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <path d="M415,363 L639,363" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <path d="M610,463 L639,463" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <path d="M415,890 L639,890" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <!-- Phase 4 内部循环 -->
  <path d="M352,546 C 380,546 400,546 429,546" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M522,575 L522,589" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M522,653 L522,665" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M430,616 C 390,616 355,655 355,749" stroke="#64748b" fill="none" marker-end="url(#arrow)"/>
  <path d="M435,700 C 428,720 428,793 415,793" stroke="#64748b" fill="none" marker-end="url(#arrow)"/>
  <!-- SPLIT_SUGGESTED（二期，紫虚线） -->
  <path d="M360,401 C 360,428 390,428 429,428" stroke="#a855f6" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow-purple)"/>

  <!-- ===== 盒子层 ===== -->
  <!-- 用户泳道 -->
  <rect x="25" y="95" width="125" height="76" rx="8" fill="#f3e8ff" stroke="#a855f6" stroke-dasharray="6,4"/>
  <text x="87" y="112" font-size="10" fill="#6b21a8" text-anchor="middle">二期 · 入口分诊</text>
  <text x="87" y="128" font-size="9" fill="#6b21a8" text-anchor="middle">自足 → 建议直接做</text>
  <text x="87" y="143" font-size="9" fill="#6b21a8" text-anchor="middle">轻档 → 跳过 1/3/4</text>
  <text x="87" y="158" font-size="9" fill="#6b21a8" text-anchor="middle">完整 ↓ 主流程</text>

  <rect x="25" y="250" width="125" height="58" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="87" y="272" font-size="10" fill="#1e40af" text-anchor="middle">用户确认契约</text>
  <text x="87" y="290" font-size="9" fill="#1e40af" text-anchor="middle">（有修正 → 改后再确认）</text>

  <rect x="25" y="760" width="125" height="66" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="87" y="781" font-size="10" fill="#1e40af" text-anchor="middle">用户审批</text>
  <text x="87" y="799" font-size="9" fill="#1e40af" text-anchor="middle">approve → Phase 6</text>
  <text x="87" y="815" font-size="9" fill="#1e40af" text-anchor="middle">reject → 重进循环</text>

  <!-- Dispatcher 泳道 -->
  <!-- S1: x=190 y=95 w=220 h=48 -->
  <rect x="190" y="95" width="220" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="300" y="115" font-size="12" fill="#b45309" text-anchor="middle">Phase 0 初始化</text>
  <text x="300" y="133" font-size="9" fill="#b45309" text-anchor="middle">resolve · mkdir .tmp · status=designing</text>

  <!-- S2: x=190 y=170 w=220 h=48 -->
  <rect x="190" y="170" width="220" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="300" y="190" font-size="12" fill="#b45309" text-anchor="middle">Phase 1 上下文快照</text>
  <text x="300" y="208" font-size="9" fill="#b45309" text-anchor="middle">parse_delimited_output --kind context_snapshot</text>

  <!-- S3: x=190 y=250 w=220 h=48 -->
  <rect x="190" y="250" width="220" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="300" y="270" font-size="12" fill="#b45309" text-anchor="middle">Phase 2 契约冻结</text>
  <text x="300" y="288" font-size="9" fill="#b45309" text-anchor="middle">契约六件套 · AskUserQuestion 轻确认</text>

  <!-- S4: x=190 y=330 w=220 h=66 -->
  <rect x="190" y="330" width="220" height="66" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="300" y="350" font-size="12" fill="#b45309" text-anchor="middle">Phase 3 设计</text>
  <text x="300" y="368" font-size="9" fill="#b45309" text-anchor="middle">派发 designer（FROZEN 契约内联）</text>
  <text x="300" y="386" font-size="9" fill="#b45309" text-anchor="middle">解析 → 契约头 + 正文 拼接覆盖</text>

  <!-- S5: x=190 y=430 w=220 h=66 -->
  <rect x="190" y="430" width="220" height="66" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="300" y="450" font-size="12" fill="#b45309" text-anchor="middle">Phase 4 全量评审（四步协议）</text>
  <text x="300" y="468" font-size="9" fill="#b45309" text-anchor="middle">冷读④ · 契约映射① · 双向扫描② · 锚点③</text>
  <text x="300" y="486" font-size="9" fill="#b45309" text-anchor="middle">verdict + Unwarranted 计数</text>

  <!-- 判定菱形 PASS? -->
  <polygon points="300,522 342,546 300,570 258,546" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="300" y="550" font-size="10" fill="#b45309" text-anchor="middle">PASS?</text>
  <text x="288" y="650" font-size="9" fill="#64748b" text-anchor="end">PASS</text>
  <text x="390" y="534" font-size="9" fill="#64748b" text-anchor="middle">FAIL</text>

  <!-- S6: x=190 y=760 w=220 h=66 -->
  <rect x="190" y="760" width="220" height="66" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="300" y="780" font-size="12" fill="#b45309" text-anchor="middle">Phase 5 审批</text>
  <text x="300" y="798" font-size="9" fill="#b45309" text-anchor="middle">契约头 + 任务清单 + 评审残留</text>
  <text x="300" y="816" font-size="9" fill="#b45309" text-anchor="middle">+ calls-you-made / Assumptions</text>

  <!-- S7: x=190 y=856 w=220 h=66 -->
  <rect x="190" y="856" width="220" height="66" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="300" y="876" font-size="12" fill="#b45309" text-anchor="middle">Phase 6 归档 + 物化</text>
  <text x="300" y="894" font-size="9" fill="#b45309" text-anchor="middle">cp → docs/ghs/plans/ · git commit</text>
  <text x="300" y="912" font-size="9" fill="#b45309" text-anchor="middle">tasks_to_features.py → features.json</text>

  <rect x="190" y="952" width="220" height="44" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="300" y="978" font-size="11" fill="#166534" text-anchor="middle">→ /ghs:code 逐 feature 实现</text>

  <!-- 子代理泳道 -->
  <rect x="440" y="170" width="165" height="48" rx="8" fill="#f3e8ff" stroke="#a855f6"/>
  <text x="522" y="190" font-size="11" fill="#6b21a8" text-anchor="middle">Context 子代理</text>
  <text x="522" y="208" font-size="9" fill="#6b21a8" text-anchor="middle">codegraph / grep 回退</text>

  <rect x="440" y="336" width="165" height="54" rx="8" fill="#f3e8ff" stroke="#a855f6"/>
  <text x="522" y="357" font-size="11" fill="#6b21a8" text-anchor="middle">designer 子代理</text>
  <text x="522" y="375" font-size="9" fill="#6b21a8" text-anchor="middle">输出正文（delimiters 协议）</text>

  <rect x="440" y="404" width="165" height="48" rx="8" fill="#f3e8ff" stroke="#a855f6" stroke-dasharray="6,4"/>
  <text x="522" y="424" font-size="10" fill="#6b21a8" text-anchor="middle">二期 SPLIT_SUGGESTED</text>
  <text x="522" y="440" font-size="9" fill="#6b21a8" text-anchor="middle">→ 用户裁决 拆分 / 合并</text>

  <rect x="440" y="430" width="165" height="66" rx="8" fill="#f3e8ff" stroke="#a855f6"/>
  <text x="522" y="450" font-size="11" fill="#6b21a8" text-anchor="middle">reviewer 子代理</text>
  <text x="522" y="468" font-size="9" fill="#6b21a8" text-anchor="middle">读契约头 + 快照</text>
  <text x="522" y="486" font-size="9" fill="#6b21a8" text-anchor="middle">signal: verdict + Unwarranted</text>

  <rect x="440" y="522" width="165" height="48" rx="8" fill="#f3e8ff" stroke="#a855f6"/>
  <text x="522" y="542" font-size="11" fill="#6b21a8" text-anchor="middle">定向修订（designer 重派）</text>
  <text x="522" y="560" font-size="9" fill="#6b21a8" text-anchor="middle">findings 逐条处置 · 禁超界扩写</text>

  <rect x="440" y="600" width="165" height="48" rx="8" fill="#f3e8ff" stroke="#a855f6"/>
  <text x="522" y="620" font-size="11" fill="#6b21a8" text-anchor="middle">定向复审（reviewer 重派）</text>
  <text x="522" y="638" font-size="9" fill="#6b21a8" text-anchor="middle">仅 verdict findings + 修复章节</text>

  <rect x="440" y="676" width="165" height="48" rx="8" fill="#f3e8ff" stroke="#a855f6"/>
  <text x="522" y="696" font-size="11" fill="#6b21a8" text-anchor="middle">最后一次修订</text>
  <text x="522" y="714" font-size="9" fill="#6b21a8" text-anchor="middle">final_fix_pending = true</text>

  <text x="512" y="668" font-size="9" fill="#64748b" text-anchor="end">有残留</text>
  <text x="345" y="680" font-size="9" fill="#64748b" text-anchor="end">无残留</text>
  <text x="416" y="742" font-size="9" fill="#64748b" text-anchor="end">修订后</text>

  <!-- 数据文件泳道 -->
  <rect x="650" y="170" width="195" height="48" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="747" y="190" font-size="11" fill="#166534" text-anchor="middle">{id}-context.md</text>
  <text x="747" y="208" font-size="9" fill="#166534" text-anchor="middle">上下文快照（50-70% 压缩）</text>

  <rect x="650" y="250" width="195" height="58" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="747" y="271" font-size="11" fill="#166534" text-anchor="middle">{id}.md</text>
  <text x="747" y="289" font-size="9" fill="#166534" text-anchor="middle">契约头（含 Global Constraints）</text>
  <text x="525" y="262" font-size="9" fill="#166534" text-anchor="middle">Write 契约头</text>

  <rect x="650" y="336" width="195" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="747" y="357" font-size="11" fill="#166534" text-anchor="middle">{id}.md</text>
  <text x="747" y="375" font-size="9" fill="#166534" text-anchor="middle">契约头 + 正文（拼接覆盖）</text>
  <text x="525" y="351" font-size="9" fill="#166534" text-anchor="middle">拼接覆盖</text>

  <rect x="650" y="430" width="195" height="66" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="747" y="452" font-size="11" fill="#166534" text-anchor="middle">{id}-review.md</text>
  <text x="747" y="470" font-size="9" fill="#166534" text-anchor="middle">评审报告 + signal 行</text>
  <text x="747" y="486" font-size="9" fill="#166534" text-anchor="middle">（会话内覆盖写 · 重放时作废）</text>

  <rect x="650" y="560" width="195" height="48" rx="8" fill="none" stroke="#cbd5e1" stroke-dasharray="6,4"/>
  <text x="747" y="580" font-size="9" fill="#64748b" text-anchor="middle">plan 文件 = 唯一范围真相</text>
  <text x="747" y="596" font-size="9" fill="#64748b" text-anchor="middle">契约头与正文同文件共写</text>

  <rect x="650" y="856" width="195" height="80" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="747" y="878" font-size="11" fill="#166534" text-anchor="middle">docs/ghs/plans/{id}.md（归档）</text>
  <text x="747" y="896" font-size="9" fill="#166534" text-anchor="middle">.ghs/features.json（p{N}-feat-{NNN}）</text>
  <text x="747" y="912" font-size="9" fill="#166534" text-anchor="middle">.ghs/progress.md（planning 条目）</text>

  <!-- ===== 顶层回环线（跨盒，最后画） ===== -->
  <!-- reject＜3：Phase 5 → 重进 Phase 4 循环 -->
  <path d="M185,795 C 178,795 175,788 175,770 L 175,470 C 175,466 176,463 179,463"
        stroke="#ef4444" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow-red)"/>
  <text x="163" y="700" font-size="9" fill="#ef4444" text-anchor="end">reject＜3 → 重进修订循环</text>

  <!-- reject≥3：契约重放，Phase 5 → Phase 2 -->
  <path d="M185,812 C 175,812 162,806 162,794 L 162,928 C 162,936 168,940 176,940 L 620,940 C 627,940 628,936 628,928 L 628,244 C 628,234 620,230 610,230 L 342,230 C 334,230 330,232 330,239"
        stroke="#ef4444" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow-red)"/>
  <text x="420" y="930" font-size="9" fill="#ef4444" text-anchor="start">reject ≥3 → 契约重放（回 Phase 2）</text>

  <!-- 图例 -->
  <rect x="190" y="1008" width="14" height="14" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="210" y="1019" font-size="10" fill="#1e293b">用户</text>
  <rect x="260" y="1008" width="14" height="14" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="280" y="1019" font-size="10" fill="#1e293b">Dispatcher</text>
  <rect x="370" y="1008" width="14" height="14" rx="3" fill="#f3e8ff" stroke="#a855f6"/>
  <text x="390" y="1019" font-size="10" fill="#1e293b">子代理</text>
  <rect x="450" y="1008" width="14" height="14" rx="3" fill="#d1fae5" stroke="#22c55e"/>
  <text x="470" y="1019" font-size="10" fill="#1e293b">数据文件</text>
  <text x="560" y="1019" font-size="10" fill="#1e293b">实线＝一期　虚线＝二期　红虚线＝reject 回环 / 契约重放</text>
</svg>
