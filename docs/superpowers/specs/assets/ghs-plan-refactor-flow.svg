<svg viewBox="0 0 880 1120" width="880" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f6"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ef4444"/>
    </marker>
  </defs>

  <text x="440" y="34" font-size="16" fill="#1e293b" text-anchor="middle">ghs:plan 重构后完整流程（Phase 0-6）</text>
  <text x="440" y="52" font-size="10" fill="#64748b" text-anchor="middle">横切：Format Recovery（MAX_RETRY=1/kind · retry_counts 落盘）｜文件真相源（分支前读 status.json）｜模型调用硬封顶 ≤4 次</text>

  <!-- 泳道背景带: 用户 x=20-160, Dispatcher x=175-425, 子代理 x=440-620, 数据文件 x=635-860 -->
  <rect x="20" y="62" width="140" height="994" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="175" y="62" width="250" height="994" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="440" y="62" width="180" height="994" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="635" y="62" width="225" height="994" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="90" y="80" font-size="11" fill="#64748b" text-anchor="middle">用户</text>
  <text x="300" y="80" font-size="11" fill="#64748b" text-anchor="middle">Dispatcher（主对话）</text>
  <text x="530" y="80" font-size="11" fill="#64748b" text-anchor="middle">子代理</text>
  <text x="747" y="80" font-size="11" fill="#64748b" text-anchor="middle">数据文件</text>

  <!-- ===== 底层连接线 ===== -->
  <!-- 主干 -->
  <path d="M300,148 L300,159" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M300,223 L300,239" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M300,303 L300,319" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M300,401 L300,469" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M300,551 L300,561" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M300,625 L300,799" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M300,881 L300,895" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M300,977 L300,991" stroke="#64748b" marker-end="url(#arrow)"/>
  <!-- 用户双向 -->
  <path d="M155,270 L179,270" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <path d="M185,292 L161,292" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <path d="M155,830 L179,830" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <path d="M185,856 L161,856" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <!-- 分诊（二期，紫虚线） -->
  <path d="M150,119 L179,119" stroke="#a855f6" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <!-- dispatcher ↔ 子代理 -->
  <path d="M415,183 L429,183" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M435,205 L421,205" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M415,340 L429,340" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M435,358 L421,358" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M415,498 L429,498" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M435,528 L421,528" stroke="#64748b" marker-end="url(#arrow)"/>
  <!-- 写文件（绿） -->
  <path d="M610,194 L639,194" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <path d="M415,274 L639,274" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <path d="M415,380 C 480,396 580,380 628,380" stroke="#22c55e" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M610,513 L639,513" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <path d="M415,940 L639,940" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <!-- Phase 4 内部循环 -->
  <path d="M352,596 C 380,596 400,596 429,596" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M522,625 L522,639" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M522,703 L522,715" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M430,666 C 390,666 355,700 355,799" stroke="#64748b" fill="none" marker-end="url(#arrow)"/>
  <path d="M435,750 C 428,770 428,843 421,843" stroke="#64748b" fill="none" marker-end="url(#arrow)"/>
  <!-- SPLIT_SUGGESTED（二期，紫虚线） -->
  <path d="M360,401 C 360,426 390,426 429,426" stroke="#a855f6" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow-purple)"/>

  <!-- ===== 盒子层 ===== -->
  <!-- 用户泳道 -->
  <rect x="25" y="95" width="125" height="76" rx="8" fill="#f3e8ff" stroke="#a855f6" stroke-dasharray="6,4"/>
  <text x="87" y="112" font-size="10" fill="#6b21a8" text-anchor="middle">二期 · 入口分诊</text>
  <text x="87" y="128" font-size="9" fill="#6b21a8" text-anchor="middle">自足 → 建议直接做</text>
  <text x="87" y="143" font-size="9" fill="#6b21a8" text-anchor="middle">轻档 → 跳过 1/3/4</text>
  <text x="87" y="158" font-size="9" fill="#6b21a8" text-anchor="middle">完整 ↓ 主流程</text>

  <rect x="25" y="250" width="125" height="58" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="87" y="272" font-size="10" fill="#1e40af" text-anchor="middle">用户确认契约</text>
  <text x="87" y="290" font-size="9" fill="#1e40af" text-anchor="middle">（有修正 → 改后再确认）</text>

  <rect x="25" y="810" width="125" height="66" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="87" y="831" font-size="10" fill="#1e40af" text-anchor="middle">用户审批</text>
  <text x="87" y="849" font-size="9" fill="#1e40af" text-anchor="middle">approve → Phase 6</text>
  <text x="87" y="865" font-size="9" fill="#1e40af" text-anchor="middle">reject → 重进循环</text>

  <!-- Dispatcher 泳道 -->
  <!-- S1: x=190 y=95 w=220 h=48 -->
  <rect x="190" y="95" width="220" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="300" y="115" font-size="12" fill="#b45309" text-anchor="middle">Phase 0 初始化</text>
  <text x="300" y="133" font-size="9" fill="#b45309" text-anchor="middle">resolve · mkdir .tmp · status=designing</text>

  <!-- S2: x=190 y=170 w=220 h=48 -->
  <rect x="190" y="170" width="220" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="300" y="190" font-size="12" fill="#b45309" text-anchor="middle">Phase 1 上下文快照</text>
  <text x="300" y="208" font-size="9" fill="#b45309" text-anchor="middle">parse_delimited_output --kind context_snapshot</text>

  <!-- S3: x=190 y=250 w=220 h=48 -->
  <rect x="190" y="250" width="220" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="300" y="270" font-size="12" fill="#b45309" text-anchor="middle">Phase 2 契约冻结</text>
  <text x="300" y="288" font-size="9" fill="#b45309" text-anchor="middle">契约六件套 · AskUserQuestion 轻确认</text>

  <!-- S4: x=190 y=330 w=220 h=66 -->
  <rect x="190" y="330" width="220" height="66" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="300" y="350" font-size="12" fill="#b45309" text-anchor="middle">Phase 3 设计</text>
  <text x="300" y="368" font-size="9" fill="#b45309" text-anchor="middle">派发 designer（FROZEN 契约内联）</text>
  <text x="300" y="386" font-size="9" fill="#b45309" text-anchor="middle">解析 → 契约头 + 正文 拼接覆盖</text>

  <!-- S5: x=190 y=480 w=220 h=66 -->
  <rect x="190" y="480" width="220" height="66" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="300" y="500" font-size="12" fill="#b45309" text-anchor="middle">Phase 4 全量评审（四步协议）</text>
  <text x="300" y="518" font-size="9" fill="#b45309" text-anchor="middle">冷读④ · 契约映射① · 双向扫描② · 锚点③</text>
  <text x="300" y="536" font-size="9" fill="#b45309" text-anchor="middle">verdict + Unwarranted 计数</text>

  <!-- 判定菱形 PASS? -->
  <polygon points="300,572 342,596 300,620 258,596" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="300" y="600" font-size="10" fill="#b45309" text-anchor="middle">PASS?</text>
  <text x="288" y="700" font-size="9" fill="#64748b" text-anchor="end">PASS</text>
  <text x="390" y="588" font-size="9" fill="#64748b" text-anchor="middle">FAIL</text>

  <!-- S6: x=190 y=810 w=220 h=66 -->
  <rect x="190" y="810" width="220" height="66" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="300" y="830" font-size="12" fill="#b45309" text-anchor="middle">Phase 5 审批</text>
  <text x="300" y="848" font-size="9" fill="#b45309" text-anchor="middle">契约头 + 任务清单 + 评审残留</text>
  <text x="300" y="866" font-size="9" fill="#b45309" text-anchor="middle">+ calls-you-made / Assumptions</text>

  <!-- S7: x=190 y=906 w=220 h=66 -->
  <rect x="190" y="906" width="220" height="66" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="300" y="926" font-size="12" fill="#b45309" text-anchor="middle">Phase 6 归档 + 物化</text>
  <text x="300" y="944" font-size="9" fill="#b45309" text-anchor="middle">cp → docs/ghs/plans/ · git commit</text>
  <text x="300" y="962" font-size="9" fill="#b45309" text-anchor="middle">tasks_to_features.py → features.json</text>

  <rect x="190" y="1002" width="220" height="44" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="300" y="1028" font-size="11" fill="#166534" text-anchor="middle">→ /ghs:code 逐 feature 实现</text>

  <!-- 子代理泳道 -->
  <rect x="440" y="170" width="165" height="48" rx="8" fill="#f3e8ff" stroke="#a855f6"/>
  <text x="522" y="190" font-size="11" fill="#6b21a8" text-anchor="middle">Context 子代理</text>
  <text x="522" y="208" font-size="9" fill="#6b21a8" text-anchor="middle">codegraph / grep 回退</text>

  <rect x="440" y="318" width="165" height="54" rx="8" fill="#f3e8ff" stroke="#a855f6"/>
  <text x="522" y="339" font-size="11" fill="#6b21a8" text-anchor="middle">designer 子代理</text>
  <text x="522" y="357" font-size="9" fill="#6b21a8" text-anchor="middle">输出正文（delimiters 协议）</text>

  <rect x="440" y="402" width="165" height="48" rx="8" fill="#f3e8ff" stroke="#a855f6" stroke-dasharray="6,4"/>
  <text x="522" y="422" font-size="10" fill="#6b21a8" text-anchor="middle">二期 SPLIT_SUGGESTED</text>
  <text x="522" y="438" font-size="9" fill="#6b21a8" text-anchor="middle">→ 用户裁决 拆分 / 合并</text>

  <rect x="440" y="480" width="165" height="66" rx="8" fill="#f3e8ff" stroke="#a855f6"/>
  <text x="522" y="500" font-size="11" fill="#6b21a8" text-anchor="middle">reviewer 子代理</text>
  <text x="522" y="518" font-size="9" fill="#6b21a8" text-anchor="middle">读契约头 + 快照</text>
  <text x="522" y="536" font-size="9" fill="#6b21a8" text-anchor="middle">signal: verdict + Unwarranted</text>

  <rect x="440" y="572" width="165" height="48" rx="8" fill="#f3e8ff" stroke="#a855f6"/>
  <text x="522" y="592" font-size="11" fill="#6b21a8" text-anchor="middle">定向修订（designer 重派）</text>
  <text x="522" y="610" font-size="9" fill="#6b21a8" text-anchor="middle">findings 逐条处置 · 禁超界扩写</text>

  <rect x="440" y="650" width="165" height="48" rx="8" fill="#f3e8ff" stroke="#a855f6"/>
  <text x="522" y="670" font-size="11" fill="#6b21a8" text-anchor="middle">定向复审（reviewer 重派）</text>
  <text x="522" y="688" font-size="9" fill="#6b21a8" text-anchor="middle">仅 verdict findings + 修复章节</text>

  <rect x="440" y="726" width="165" height="48" rx="8" fill="#f3e8ff" stroke="#a855f6"/>
  <text x="522" y="746" font-size="11" fill="#6b21a8" text-anchor="middle">最后一次修订</text>
  <text x="522" y="764" font-size="9" fill="#6b21a8" text-anchor="middle">final_fix_pending = true</text>

  <text x="512" y="718" font-size="9" fill="#64748b" text-anchor="end">有残留</text>
  <text x="345" y="730" font-size="9" fill="#64748b" text-anchor="end">无残留</text>
  <text x="416" y="800" font-size="9" fill="#64748b" text-anchor="end">修订后</text>

  <!-- 数据文件泳道 -->
  <rect x="650" y="170" width="195" height="48" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="747" y="190" font-size="11" fill="#166534" text-anchor="middle">{id}-context.md</text>
  <text x="747" y="208" font-size="9" fill="#166534" text-anchor="middle">上下文快照（50-70% 压缩）</text>

  <rect x="650" y="250" width="195" height="58" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="747" y="271" font-size="11" fill="#166534" text-anchor="middle">{id}.md</text>
  <text x="747" y="289" font-size="9" fill="#166534" text-anchor="middle">契约头（含 Global Constraints）</text>
  <text x="525" y="262" font-size="9" fill="#166534" text-anchor="middle">Write 契约头</text>

  <rect x="650" y="336" width="195" height="54" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="747" y="357" font-size="11" fill="#166534" text-anchor="middle">{id}.md</text>
  <text x="747" y="375" font-size="9" fill="#166534" text-anchor="middle">契约头 + 正文（拼接覆盖）</text>

  <rect x="650" y="480" width="195" height="66" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="747" y="502" font-size="11" fill="#166534" text-anchor="middle">{id}-review.md</text>
  <text x="747" y="520" font-size="9" fill="#166534" text-anchor="middle">评审报告 + signal 行</text>
  <text x="747" y="538" font-size="9" fill="#166534" text-anchor="middle">（会话内覆盖写 · 重放时作废）</text>

  <rect x="650" y="580" width="195" height="48" rx="8" fill="none" stroke="#cbd5e1" stroke-dasharray="6,4"/>
  <text x="747" y="600" font-size="9" fill="#64748b" text-anchor="middle">plan 文件 = 唯一范围真相</text>
  <text x="747" y="616" font-size="9" fill="#64748b" text-anchor="middle">契约头与正文同文件共写</text>

  <rect x="650" y="906" width="195" height="72" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="747" y="928" font-size="11" fill="#166534" text-anchor="middle">docs/ghs/plans/{id}.md（归档）</text>
  <text x="747" y="946" font-size="9" fill="#166534" text-anchor="middle">.ghs/features.json（p{N}-feat-{NNN}）</text>
  <text x="747" y="962" font-size="9" fill="#166534" text-anchor="middle">.ghs/progress.md（planning 条目）</text>

  <!-- ===== 顶层回环线（跨盒，最后画） ===== -->
  <!-- reject＜3：Phase 5 → 重进 Phase 4 循环 -->
  <path d="M185,845 C 178,845 175,838 175,820 L 175,524 C 175,520 176,517 179,517"
        stroke="#ef4444" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow-red)"/>
  <text x="163" y="700" font-size="9" fill="#ef4444" text-anchor="end">reject＜3 → 重进修订循环</text>

  <!-- reject≥3：契约重放，Phase 5 → Phase 2 -->
  <path d="M185,862 C 175,862 162,856 162,844 L 162,978 C 162,986 168,990 176,990 L 620,990 C 627,990 628,986 628,978 L 628,244 C 628,234 620,230 610,230 L 342,230 C 334,230 330,232 330,239"
        stroke="#ef4444" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow-red)"/>
  <text x="420" y="980" font-size="9" fill="#ef4444" text-anchor="start">reject ≥3 → 契约重放（回 Phase 2）</text>

  <!-- 图例 -->
  <rect x="190" y="1082" width="14" height="14" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="210" y="1093" font-size="10" fill="#1e293b">用户</text>
  <rect x="260" y="1082" width="14" height="14" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="280" y="1093" font-size="10" fill="#1e293b">Dispatcher</text>
  <rect x="370" y="1082" width="14" height="14" rx="3" fill="#f3e8ff" stroke="#a855f6"/>
  <text x="390" y="1093" font-size="10" fill="#1e293b">子代理</text>
  <rect x="450" y="1082" width="14" height="14" rx="3" fill="#d1fae5" stroke="#22c55e"/>
  <text x="470" y="1093" font-size="10" fill="#1e293b">数据文件</text>
  <text x="560" y="1093" font-size="10" fill="#1e293b">实线＝一期　虚线＝二期　红虚线＝reject 回环 / 契约重放</text>
</svg>
